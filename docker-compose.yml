version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: edus-postgres
    environment:
      POSTGRES_USER: edus_dev
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: edus_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edus_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edus-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: edus-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edus-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: edus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edus-network

  # Auth Service (ASP.NET Core 9 + EF Core)
  # Milestone 1.1: Real microservice implementation
  auth-service:
    image: edus-auth-service:latest
    container_name: edus-auth-service
    build:
      context: .
      dockerfile: services/Dockerfile.auth
    ports:
      - "6001:6001"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6001
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=edus_dev;Username=edus_dev;Password=dev_password_123;"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SERILOG_LEVEL: Information
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (YARP + ASP.NET Core 9)
  # Milestone 1.1: Routes /api/v1/* to internal services
  # NOTE: No host port exposed — only reachable via Docker network from Nginx
  api-gateway:
    image: edus-api-gateway:latest
    container_name: edus-gateway
    build:
      context: .
      dockerfile: services/Dockerfile.gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SERILOG_LEVEL: Information
    depends_on:
      auth-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      teacher-service:
        condition: service_healthy
      parent-service:
        condition: service_healthy
      school-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Student Service (ASP.NET Core 9 + EF Core)
  student-service:
    image: edus-student-service:latest
    container_name: edus-student-service
    build:
      context: .
      dockerfile: services/Dockerfile.student
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6002
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=edus_dev;Username=edus_dev;Password=dev_password_123;"
      SERILOG_LEVEL: Information
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Teacher Service (ASP.NET Core 9 + EF Core)
  teacher-service:
    image: edus-teacher-service:latest
    container_name: edus-teacher-service
    build:
      context: .
      dockerfile: services/Dockerfile.teacher
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6003
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=edus_dev;Username=edus_dev;Password=dev_password_123;"
      SERILOG_LEVEL: Information
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6003/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Parent Service (ASP.NET Core 9 + EF Core)
  parent-service:
    image: edus-parent-service:latest
    container_name: edus-parent-service
    build:
      context: .
      dockerfile: services/Dockerfile.parent
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6004
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=edus_dev;Username=edus_dev;Password=dev_password_123;"
      SERILOG_LEVEL: Information
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6004/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # School Service (ASP.NET Core 9 + EF Core)
  school-service:
    image: edus-school-service:latest
    container_name: edus-school-service
    build:
      context: .
      dockerfile: services/Dockerfile.school
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6005
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=edus_dev;Username=edus_dev;Password=dev_password_123;"
      SERILOG_LEVEL: Information
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6005/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: edus-nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "sh", "-c", "test -e /run/nginx.pid || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # React Frontend
  frontend:
    image: edus-frontend:latest
    container_name: edus-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "8000:3000"
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - PostgreSQL Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edus.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Exporter - Convert postgres metrics to Prometheus format
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: edus-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://edus_dev:dev_password_123@postgres:5432/edus_dev?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Exporter - Convert redis metrics to Prometheus format
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: edus-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Exporter - Convert rabbitmq metrics to Prometheus format
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: edus-rabbitmq-exporter
    environment:
      RABBIT_URL: "http://rabbitmq:15672"
      RABBIT_USER: "guest"
      RABBIT_PASSWORD: "guest"
      PUBLISH_PORT: "9419"
    ports:
      - "9419:9419"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9419/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus - Metrics Collection & Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: edus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - auth-service
      - school-service
      - student-service
      - teacher-service
      - parent-service
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: edus-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - edus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  edus-network:
    driver: bridge
