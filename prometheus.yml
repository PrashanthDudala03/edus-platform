global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'edus-platform'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Auth Service - Health Check (plain HTTP, not metrics parsing)
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:6001']
    metrics_path: '/api/health'
    scrape_interval: 15s
    scrape_timeout: 10s

  # School Service - Health Check
  - job_name: 'school-service'
    static_configs:
      - targets: ['school-service:6005']
    metrics_path: '/api/health'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Student Service - Health Check
  - job_name: 'student-service'
    static_configs:
      - targets: ['student-service:6002']
    metrics_path: '/api/health'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Teacher Service - Health Check
  - job_name: 'teacher-service'
    static_configs:
      - targets: ['teacher-service:6003']
    metrics_path: '/api/health'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Parent Service - Health Check
  - job_name: 'parent-service'
    static_configs:
      - targets: ['parent-service:6004']
    metrics_path: '/api/health'
    scrape_interval: 15s
    scrape_timeout: 10s

  # API Gateway - Health Check
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:5000']
    metrics_path: '/api/v1/health'
    scrape_interval: 15s
    scrape_timeout: 10s

  # PostgreSQL via postgres_exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s
    scrape_timeout: 10s

  # Redis via redis_exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s
    scrape_timeout: 10s

  # RabbitMQ via rabbitmq_exporter
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
    scrape_interval: 15s
    scrape_timeout: 10s
