name: EduOS release checks

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend install and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: .NET tests and service builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test services/shared/EduOS.ServiceAuth.Tests/EduOS.ServiceAuth.Tests.csproj --configuration Release
      - run: dotnet test services/auth-service.tests/auth-service.tests.csproj --configuration Release
      - run: dotnet build services/auth-service/auth-service.csproj --configuration Release
      - run: dotnet build services/api-gateway/api-gateway.csproj --configuration Release
      - run: dotnet build services/school-service/school-service.csproj --configuration Release
      - run: dotnet build services/student-service/student-service.csproj --configuration Release
      - run: dotnet build services/teacher-service/teacher-service.csproj --configuration Release
      - run: dotnet build services/parent-service/parent-service.csproj --configuration Release

  deployment-config:
    name: Deployment configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file syntax
        env:
          POSTGRES_PASSWORD: validation-only-not-a-secret
          JWT_PRIVATE_KEY: dmFsaWRhdGlvbi1vbmx5
          JWT_PUBLIC_KEY: dmFsaWRhdGlvbi1vbmx5
          EDUOS_BOOTSTRAP_SCHOOL_NAME: Validation School
          EDUOS_BOOTSTRAP_ADMIN_USERNAME: validation-admin
          EDUOS_BOOTSTRAP_ADMIN_EMAIL: validation@example.invalid
          EDUOS_BOOTSTRAP_ADMIN_PASSWORD: validation-only-password-123456
          PGADMIN_DEFAULT_EMAIL: ci@example.invalid
          PGADMIN_DEFAULT_PASSWORD: validation-only-pgadmin-password
        run: docker compose config --quiet

  container-builds:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: .
            file: services/Dockerfile.auth
          - name: api-gateway
            context: .
            file: services/Dockerfile.gateway
          - name: school-service
            context: .
            file: services/Dockerfile.school
          - name: student-service
            context: .
            file: services/Dockerfile.student
          - name: teacher-service
            context: .
            file: services/Dockerfile.teacher
          - name: parent-service
            context: .
            file: services/Dockerfile.parent
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false

  integration:
    name: Real-service school workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/setup-local.mjs
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: npx playwright test
        working-directory: frontend
      - if: always()
        run: docker compose down
